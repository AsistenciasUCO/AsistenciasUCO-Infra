# ==============================================================================
# Traefik Dynamic Configuration: Hardened Security Headers
# ==============================================================================
http:
  middlewares:
    sec-headers:
      headers:
        frameDeny: true
        sslRedirect: false
        browserXssFilter: true
        contentTypeNosniff: true
        forceSTSHeader: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "DENY"
        referrerPolicy: "strict-origin-when-cross-origin"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"
        contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' ws: wss:; object-src 'none'; frame-ancestors 'none';"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"
          Server: ""
          X-Powered-By: ""

    rate-limit:
      rateLimit:
        average: 100
        burst: 50
        period: 1m
