# ==============================================================================
# Traefik Dynamic Configuration: routers y servicios (CF-03)
# Hosts *.localhost resuelven a 127.0.0.1 sin editar el archivo hosts.
#   https://app.localhost  -> frontend  (ng serve en el host :4200, o contenedor FE en :8080)
#   https://api.localhost  -> backend   (API Spring Boot en el host :8080)
# Todo router lleva sus middlewares de seguridad y de limite de tasa; el TLS lo
# resuelve el entrypoint websecure (traefik.yml).
# ==============================================================================
http:
  routers:
    frontend:
      rule: "Host(`app.localhost`)"
      entryPoints: [websecure]
      middlewares: [sec-headers-web, rate-limit-web]
      service: frontend
      tls: {}

    backend:
      rule: "Host(`api.localhost`)"
      entryPoints: [websecure]
      middlewares: [sec-headers, rate-limit]
      service: backend
      tls: {}

  services:
    frontend:
      loadBalancer:
        servers:
          # Contenedor del FE en la red de compose: http://frontend:8080
          - url: "http://host.docker.internal:4200"
    backend:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:8080"
