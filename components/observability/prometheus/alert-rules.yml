# ==============================================================================
# Reglas de alerta minimas - Asistencias UCO (OBS-12)
# Cargadas por rule_files en prometheus.yml. Receptor local en alertmanager.yml.
# Validar: promtool check rules components/observability/prometheus/alert-rules.yml
# ==============================================================================
groups:
  - name: asistencias-backend
    rules:
      - alert: BackendCaido
        expr: up{job="asistencias-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend no responde al scrape de Prometheus"
          description: "El actuator del backend (puerto de gestion 8090) no responde desde hace 2 minutos."

      - alert: TasaErrores5xxAlta
        expr: |
          sum(rate(http_server_requests_seconds_count{job="asistencias-backend",status=~"5.."}[5m]))
            /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="asistencias-backend"}[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mas del 5 % de las respuestas del backend son 5xx"
          description: "Proporcion de errores 5xx en los ultimos 5 minutos: {{ $value | humanizePercentage }}."

      - alert: LatenciaP95Alta
        # Requiere histogramas de http.server.requests (management.metrics.distribution.percentiles-histogram);
        # sin ellos la serie _bucket no existe y la regla no dispara (LatenciaMediaAlta sirve de respaldo).
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="asistencias-backend"}[5m]))) > 1.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latencia p95 del backend superior a 1,5 s"
          description: "p95 de las ultimas peticiones: {{ $value | humanizeDuration }}."

      - alert: LatenciaMediaAlta
        expr: |
          sum(rate(http_server_requests_seconds_sum{job="asistencias-backend"}[5m]))
            /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="asistencias-backend"}[5m])), 1e-9) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latencia media del backend superior a 1 s"
          description: "Latencia media de los ultimos 5 minutos: {{ $value | humanizeDuration }}."

      - alert: PoolConexionesSaturado
        expr: |
          (hikaricp_connections_active{job="asistencias-backend"} / hikaricp_connections_max{job="asistencias-backend"}) > 0.9
          or
          hikaricp_connections_pending{job="asistencias-backend"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pool de conexiones Hikari saturado"
          description: "Conexiones activas cerca del maximo o hilos esperando una conexion (pool {{ $labels.pool }})."

      - alert: JvmHeapAlto
        expr: |
          sum by (instance) (jvm_memory_used_bytes{job="asistencias-backend",area="heap"})
            /
          sum by (instance) (jvm_memory_max_bytes{job="asistencias-backend",area="heap"}) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Heap de la JVM por encima del 90 %"
          description: "Uso de heap sostenido: {{ $value | humanizePercentage }}."
