# ==============================================================================
# Grafana Tempo (monolitico, solo desarrollo) - Asistencias UCO (OBS-09)
# Recibe OTLP desde el collector (tempo:4317) y guarda bloques en /var/tempo (tmpfs).
# ==============================================================================
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
