name: Infra Contents Validation

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.74.0
  # Mismas versiones que docker-compose.yml, para validar con el binario que corre en el stack.
  PROMETHEUS_IMAGE: prom/prometheus:v3.0.1
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.35.0

jobs:
  infra-contents:
    name: Validate official Infra contents
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose syntax without starting services
        shell: bash
        # F-TRX-011 (CULM-001 D.9): MSSQL_SA_PASSWORD y GRAFANA_ADMIN_PASSWORD son obligatorias en
        # docker-compose.yml; la validacion usa los valores de ejemplo de .env.example (no son secretos)
        # sin arrancar servicios.
        run: |
          set -euo pipefail
          test -f docker-compose.yml
          test -f .env.example
          grep -q '^GRAFANA_ADMIN_PASSWORD=' .env.example || {
            echo '::error::.env.example must declare GRAFANA_ADMIN_PASSWORD (required by docker-compose.yml).'
            exit 1
          }
          docker compose --env-file .env.example -f docker-compose.yml config --quiet

      - name: Validate Compose referenced files
        shell: bash
        run: |
          set -euo pipefail
          required_paths=(
            components/keycloak/realm-import
            components/observability/otel-collector/config.yaml
            components/observability/prometheus/prometheus.yml
            components/observability/prometheus/alert-rules.yml
            components/observability/alertmanager/alertmanager.yml
            components/observability/tempo/tempo.yaml
            components/observability/grafana/provisioning
            components/proxy/traefik.yml
            components/proxy/dynamic
            components/proxy/dynamic/routers.yml
          )
          for required_path in "${required_paths[@]}"; do
            test -e "$required_path" || {
              echo "::error::Missing Compose referenced path: $required_path"
              exit 1
            }
          done

      - name: Validate Prometheus config and alert rules (promtool)
        shell: bash
        run: |
          set -euo pipefail
          prom_dir="${GITHUB_WORKSPACE}/components/observability/prometheus"
          docker run --rm -v "${prom_dir}:/etc/prometheus:ro" --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check rules /etc/prometheus/alert-rules.yml
          docker run --rm -v "${prom_dir}:/etc/prometheus:ro" --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yml

      - name: Validate Alertmanager config (amtool)
        shell: bash
        run: |
          set -euo pipefail
          am_dir="${GITHUB_WORKSPACE}/components/observability/alertmanager"
          docker run --rm -v "${am_dir}:/etc/alertmanager:ro" --entrypoint amtool "$ALERTMANAGER_IMAGE" \
            check-config /etc/alertmanager/alertmanager.yml

      # TRI-05 (VAL oleada 2, decision E): inventario SARIF completo (no bloquea, va a Code Scanning)
      # y compuerta que bloquea HIGH/CRITICAL (vuln con correccion, misconfig y secretos).
      # Excepciones en .trivyignore, cada una justificada y con fecha de revision.
      - name: Trivy configuration and filesystem inventory (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: sarif
          output: infra-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: false
          trivyignores: .trivyignore

      - name: Trivy configuration and filesystem gate (blocks HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          format: table
          output: ''
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Publish Trivy findings to Code Scanning
        if: always() && hashFiles('infra-trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: infra-trivy.sarif
          category: trivy-infra

      - name: Upload Trivy inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infra-trivy-inventory
          path: infra-trivy.sarif
          if-no-files-found: ignore

      - name: Inspect runtime artifacts without deploying
        shell: pwsh
        run: |
          $runtimeCandidates = @(
            'Dockerfile',
            'docker-compose.yml',
            'docker-compose.yaml',
            'docker',
            'k8s',
            'helm',
            'terraform',
            'bicep',
            'manifests',
            'scripts'
          )
          $present = @($runtimeCandidates | Where-Object { Test-Path -LiteralPath $_ })
          if ($present.Count -eq 0) {
              $status = 'NOT_APPLICABLE'
              Write-Host 'INFRA_RUNTIME_VALIDATION=NOT_APPLICABLE'
              Write-Host 'No runtime/deployment artifacts are present in the official Infra repository.'
          } else {
              $status = 'PRESENT_REQUIRES_OWNER_REVIEW'
              Write-Host ('INFRA_RUNTIME_ARTIFACTS=' + ($present -join ','))
              Write-Host 'INFRA_RUNTIME_VALIDATION=PRESENT_REQUIRES_OWNER_REVIEW'
              Write-Host 'Runtime artifacts are present; owner review is required before any controlled runtime validation.'
          }
          "INFRA_RUNTIME_VALIDATION=$status" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

  # SEC-05 / SEC-08 (VAL oleada 2): gitleaks bloquea secretos nuevos. Solo escanea los commits que
  # trae el PR (o el push), no el historial completo: el historial ya contiene valores viejos que
  # quedaron invalidados con la rotacion de credenciales (ver docs/work-items/VAL-oleada2-cumplimiento).
  # Se usa el binario oficial con SHA-256 fijado (gitleaks-action exige licencia para cuentas de organizacion).
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history for the commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release, checksum verified)
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 2 --retry-all-errors --connect-timeout 20 --max-time 120 \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "${RUNNER_TEMP}/${archive}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/gitleaks-bin" gitleaks
          echo "${RUNNER_TEMP}/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Scan commits introduced by this change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero='0000000000000000000000000000000000000000'
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "$zero" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            range="-1 ${PUSH_AFTER}"
          fi
          echo "Gitleaks commit range: ${range}"
          gitleaks git . \
            --config .github/gitleaks.toml \
            --log-opts="${range}" \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 1
