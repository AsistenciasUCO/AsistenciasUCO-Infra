# Seccion ext-parametros: Catalogo de Parametros 0.1.17 / frontend 0.1.16 (kit del equipo, Complementos/CatalogoParametros/Catalogo-Parametros).
# Se aplica sobre su docker-compose.yml (sin tocarlo); solo app, frontend, redis, surrealdb y su broker propio pulsar-parametros
# (sin su observabilidad: el escenario `parametros` no necesita ClamAV ni asis-obs).
# Usa el puerto 8081 del PC: no puede convivir con asis-contingencia (Keycloak propio, tambien 8081).
services:
  app:
    container_name: ext-parametros-app
    # El compose del equipo hace depender a app de otel-collector (y este de jaeger): sin esto `up app` arrancaria su
    # observabilidad completa. Se conservan solo las dependencias reales (el app registra un UnknownHostException de
    # otel-collector, inofensivo).
    depends_on: !override
      surrealdb:
        condition: service_started
      redis:
        condition: service_started
      pulsar-parametros:
        condition: service_healthy
    networks:
      asis-red:
        aliases: [ext-parametros-app]
    labels:
      asistencias.seccion: ext-parametros
  frontend:
    container_name: ext-parametros-frontend
    labels:
      asistencias.seccion: ext-parametros
  # Broker propio del Catalogo (eventos de cambios de parametros). El Backend (asis-red) llega por el alias
  # pulsar-parametros:6650 (listener "internal": el broker se anuncia como pulsar-parametros:6650, que resuelve en asis-red).
  # Desde el PC: pulsar://localhost:6652 (listener "external"); administracion http://localhost:8082.
  pulsar-parametros:
    container_name: ext-parametros-pulsar
    networks:
      catalogo: {}
      asis-red:
        aliases: [pulsar-parametros]
    labels:
      asistencias.seccion: ext-parametros
  redis:
    container_name: ext-parametros-redis
    labels:
      asistencias.seccion: ext-parametros
  surrealdb:
    container_name: ext-parametros-surrealdb
    labels:
      asistencias.seccion: ext-parametros
  prometheus:
    container_name: ext-parametros-prometheus
  grafana:
    container_name: ext-parametros-grafana
  otel-collector:
    container_name: ext-parametros-otel
  jaeger:
    container_name: ext-parametros-jaeger
  loki:
    container_name: ext-parametros-loki
  promtail:
    container_name: ext-parametros-promtail

volumes:
  redis-data:
    name: catalogo-parametros_redis-data
    external: true
  surrealdb-data:
    name: catalogo-parametros_surrealdb-data
    external: true
  grafana-data:
    name: catalogo-parametros_grafana-data
    external: true
  prometheus-data:
    name: catalogo-parametros_prometheus-data
    external: true
  pulsar-parametros-data:
    name: catalogo-parametros_pulsar-parametros-data
    external: true
  pulsar-parametros-conf:
    name: catalogo-parametros_pulsar-parametros-conf
    external: true

networks:
  asis-red:
    name: asis-red
    external: true
