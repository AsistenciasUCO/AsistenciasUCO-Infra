# Seccion ext-seguridad: componente de Seguridad del equipo (Security Baseline 0.1.14).
# Se aplica sobre GestioAsistenciaBackend/infra/security-baseline/compose.yaml con --env-file %USERPROFILE%\.asistencias-security-lab\lab.env.
# Solo renombra contenedores, conserva los volumenes existentes y expone en asis-red lo que usa el Backend en contenedor:
#   keycloak.localhost:19090 (mismo emisor de los tokens que ve el navegador), PDP (8080) y PEP (8081).
services:
  keycloak:
    container_name: ext-seguridad-keycloak
    networks:
      asis-red:
        aliases: [keycloak.localhost, ext-seguridad-keycloak]
    labels:
      asistencias.seccion: ext-seguridad
  keycloak-relay:
    container_name: ext-seguridad-keycloak-relay
    labels:
      asistencias.seccion: ext-seguridad
  surrealdb:
    container_name: ext-seguridad-surrealdb
    labels:
      asistencias.seccion: ext-seguridad
  redis:
    container_name: ext-seguridad-redis
    labels:
      asistencias.seccion: ext-seguridad
  opa:
    container_name: ext-seguridad-opa
    labels:
      asistencias.seccion: ext-seguridad
  pdp:
    container_name: ext-seguridad-pdp
    networks:
      asis-red:
        aliases: [ext-seguridad-pdp]
    labels:
      asistencias.seccion: ext-seguridad
  pep:
    container_name: ext-seguridad-pep
    networks:
      asis-red:
        aliases: [ext-seguridad-pep]
    labels:
      asistencias.seccion: ext-seguridad
  # SEC-BASELINE-020 (0.1.14): broker de eventos de asignacion del PDP. El Backend en contenedor lo alcanza por asis-red
  # (asis-app-enlaces reenvia 127.0.0.1:25672 -> ext-seguridad-rabbitmq:5672); en el PC queda en 127.0.0.1:25672/25673.
  rabbitmq:
    container_name: ext-seguridad-rabbitmq
    networks:
      asis-red:
        aliases: [ext-seguridad-rabbitmq]
    labels:
      asistencias.seccion: ext-seguridad
  # El exchange compartido security.assignment.events (direct, durable) lo aprovisiona la plataforma, no cada aplicacion
  # (manual de eventos del PDP 0.1.14, seccion 4; el Backend solo declara su cola y su binding). Sin el, el binding del
  # Backend falla con 404 NOT_FOUND y no llega ningun evento. Declaracion idempotente con rabbitmqadmin de la misma imagen.
  rabbitmq-init:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.4.1-management}
    container_name: ext-seguridad-rabbitmq-init
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQADMIN_TARGET_HOST: rabbitmq
      RABBITMQADMIN_TARGET_PORT: "15672"
      RABBITMQADMIN_TARGET_VHOST: /security
      RABBITMQADMIN_NON_INTERACTIVE_MODE: "true"
      RABBITMQ_INIT_USERNAME: ${RABBITMQ_USERNAME:?Configure RABBITMQ_USERNAME}
      RABBITMQ_INIT_PASSWORD: ${RABBITMQ_PASSWORD:?Configure RABBITMQ_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rabbitmqadmin --username "$$RABBITMQ_INIT_USERNAME" --password "$$RABBITMQ_INIT_PASSWORD"
        declare exchange --name security.assignment.events --type direct --durable true --auto-delete false
    networks: [lab]
    restart: "no"
    labels:
      asistencias.seccion: ext-seguridad

  # Consola de administracion de seguridad: micro frontend security-ui del equipo de Seguridad, que la SPA carga en
  # «Seguridad UCO» desde http://localhost:5175 (SECURITY_BASELINE_UI_URL). Sirve el dist ya construido del componente
  # (Complementos/Seguridad/security-ui/dist, solo lectura: el repo del componente no se toca) con CORS abierto, como
  # `vite preview`, porque la SPA lo importa como modulo ES desde otro origen. Reemplaza el `npm run preview` manual.
  consola:
    image: nginx:1.31.8-alpine
    container_name: ext-seguridad-consola
    volumes:
      - ../../../Complementos/Seguridad/security-ui/dist:/usr/share/nginx/html:ro
    configs:
      - source: consola-nginx
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:5175:80"
    networks: [lab]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/security-administration.js"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: "no"
    labels:
      asistencias.seccion: ext-seguridad

configs:
  consola-nginx:
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;
          location / {
              # Laboratorio local: mismo comodin que `vite preview` (cors: true). Solo publicado en 127.0.0.1.
              add_header Access-Control-Allow-Origin "*" always;
              add_header Cache-Control "no-cache" always;
              try_files $$uri =404;
          }
      }

volumes:
  asistencias-security-lab-keycloak-data:
    name: asistencias-security-lab_asistencias-security-lab-keycloak-data
    external: true
  asistencias-security-lab-surrealdb-data:
    name: asistencias-security-lab_asistencias-security-lab-surrealdb-data
    external: true
  asistencias-security-lab-redis-data:
    name: asistencias-security-lab_asistencias-security-lab-redis-data
    external: true
  # Nuevo en 0.1.14: no es externo (compose lo crea la primera vez), con el mismo prefijo que los demas volumenes.
  asistencias-security-lab-rabbitmq-data:
    name: asistencias-security-lab_asistencias-security-lab-rabbitmq-data

networks:
  lab:
    name: asistencias-security-lab-net
    external: true
  asis-red:
    name: asis-red
    external: true
