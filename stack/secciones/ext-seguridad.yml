# Seccion ext-seguridad: componente de Seguridad del equipo (Security Baseline 0.1.13).
# Se aplica sobre GestioAsistenciaBackend/infra/security-baseline/compose.yaml con --env-file %USERPROFILE%\.asistencias-security-lab\lab.env.
# Solo renombra contenedores, conserva los volumenes existentes y expone en asis-red lo que usa el Backend en contenedor:
#   keycloak.localhost:19090 (mismo emisor de los tokens que ve el navegador), PDP (8080) y PEP (8081).
services:
  keycloak:
    container_name: ext-seguridad-keycloak
    networks:
      asis-red:
        aliases: [keycloak.localhost, ext-seguridad-keycloak]
    labels:
      asistencias.seccion: ext-seguridad
  keycloak-relay:
    container_name: ext-seguridad-keycloak-relay
    labels:
      asistencias.seccion: ext-seguridad
  surrealdb:
    container_name: ext-seguridad-surrealdb
    labels:
      asistencias.seccion: ext-seguridad
  redis:
    container_name: ext-seguridad-redis
    labels:
      asistencias.seccion: ext-seguridad
  opa:
    container_name: ext-seguridad-opa
    labels:
      asistencias.seccion: ext-seguridad
  pdp:
    container_name: ext-seguridad-pdp
    networks:
      asis-red:
        aliases: [ext-seguridad-pdp]
    labels:
      asistencias.seccion: ext-seguridad
  pep:
    container_name: ext-seguridad-pep
    networks:
      asis-red:
        aliases: [ext-seguridad-pep]
    labels:
      asistencias.seccion: ext-seguridad

  # Consola de administracion de seguridad: micro frontend security-ui del equipo de Seguridad, que la SPA carga en
  # «Seguridad UCO» desde http://localhost:5175 (SECURITY_BASELINE_UI_URL). Sirve el dist ya construido del componente
  # (Complementos/Seguridad/security-ui/dist, solo lectura: el repo del componente no se toca) con CORS abierto, como
  # `vite preview`, porque la SPA lo importa como modulo ES desde otro origen. Reemplaza el `npm run preview` manual.
  consola:
    image: nginx:1.31.8-alpine
    container_name: ext-seguridad-consola
    volumes:
      - ../../../Complementos/Seguridad/security-ui/dist:/usr/share/nginx/html:ro
    configs:
      - source: consola-nginx
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:5175:80"
    networks: [lab]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/security-administration.js"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: "no"
    labels:
      asistencias.seccion: ext-seguridad

configs:
  consola-nginx:
    content: |
      server {
          listen 80;
          root /usr/share/nginx/html;
          location / {
              # Laboratorio local: mismo comodin que `vite preview` (cors: true). Solo publicado en 127.0.0.1.
              add_header Access-Control-Allow-Origin "*" always;
              add_header Cache-Control "no-cache" always;
              try_files $$uri =404;
          }
      }

volumes:
  asistencias-security-lab-keycloak-data:
    name: asistencias-security-lab_asistencias-security-lab-keycloak-data
    external: true
  asistencias-security-lab-surrealdb-data:
    name: asistencias-security-lab_asistencias-security-lab-surrealdb-data
    external: true
  asistencias-security-lab-redis-data:
    name: asistencias-security-lab_asistencias-security-lab-redis-data
    external: true

networks:
  lab:
    name: asistencias-security-lab-net
    external: true
  asis-red:
    name: asis-red
    external: true
